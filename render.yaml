services:
  # ---------------------------------------------------------------------------
  # 1. MediKiosk FastAPI Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: medikiosk-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: medikiosk-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/medikiosk.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: https://medikiosk-frontend.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  # ---------------------------------------------------------------------------
  # 2. MediKiosk React 18 / Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: medikiosk-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: medikiosk-backend
          property: host

