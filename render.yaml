services:
  # ---------------------------------------------------------------------------
  # 1. MediKiosk FastAPI Backend Web Service (Free Tier Compatible)
  # ---------------------------------------------------------------------------
  - type: web
    name: medikiosk-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: medikiosk.db
      - key: UPLOADS_DIR
        value: uploads
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-2-latest
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  # ---------------------------------------------------------------------------
  # 2. MediKiosk React 18 / Vite Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: medikiosk-frontend
    rootDir: Frontend
    buildCommand: npm install --include=optional && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /assets/*
        destination: /assets/*
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: medikiosk-backend
          property: host
